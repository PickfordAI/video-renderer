<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Watch a story · Pickford</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090b10; color: #f4f1eb; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 7vh 24px; min-height: 100vh; background: radial-gradient(ellipse at 10% 0, #271c20, transparent 65%); }
    main { max-width: 980px; margin: auto; }
    .eyebrow { color: #ff987b; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(26px, 5vw, 48px); letter-spacing: -.04em; margin-bottom: 12px; }
    p { color: #b8b9bf; line-height: 1.6; }
    video { width: 100%; aspect-ratio: 16/9; background: black; border-radius: 16px; }
    button { background: #ff825e; color: #17110e; border: 0; border-radius: 8px; padding: 12px 18px; font: inherit; cursor: pointer; }
    #setup { margin: 32px 0; padding: 24px; border: 1px solid #30313c; border-radius: 16px; background: #11141b; }
    #setup h2 { margin-top: 0; font-size: 18px; }
    #setup p { margin-bottom: 0; }
    #checks { list-style: none; padding: 0; display: grid; gap: 16px; }
    #checks li { display: flex; justify-content: space-between; gap: 24px; }
    #checks span { color: #ffba9f; }
    #checks .ready { color: #90d5bd; }
    a { color: #ffc2ac; }
    footer { margin-top: 32px; color: #8d9099; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Pickford · Story player</div>
    <h1>Your story, on screen.</h1>
    <p id="status" role="status">Connecting to the story…</p>
    <section id="setup" hidden aria-labelledby="setup-title">
      <h2 id="setup-title">Your agent handles setup.</h2>
      <ul id="checks"></ul>
      <p>No connection details to fill in here. Your agent connects your accounts and starts the story.</p>
    </section>
    <video id="video" controls playsinline preload="none" hidden></video>
    <p><button id="play" hidden>Watch with sound</button></p>
    <p id="share" hidden><a id="watch-link" target="_blank" rel="noreferrer">Open watch link</a></p>
    <footer>Made with Pickford. Playback appears here when your story is ready.</footer>
  </main>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
