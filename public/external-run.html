<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Public Renderer Run — H3 Director</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #090b10; color: #f3f0e9; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: radial-gradient(circle at 20% 0, #25191b, #090b10 42rem); }
      main { width: min(980px, 100%); margin: auto; }
      h1 { margin: 8px 0; font-size: 38px; letter-spacing: -.04em; }
      p { color: #9da3af; line-height: 1.55; }
      form, section { margin-top: 22px; padding: 22px; border: 1px solid #292d36; border-radius: 14px; background: #10131a; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      label { display: grid; gap: 6px; color: #aeb2bb; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
      input, select { width: 100%; padding: 11px; border: 1px solid #30343d; border-radius: 8px; color: #f3f0e9; background: #090b10; }
      .wide { grid-column: 1 / -1; }
      button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 8px; background: #ff6b4a; color: #1a0c08; font-weight: 750; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      button[hidden] { display: none; }
      #stop { margin-left: 8px; background: #361719; color: #ffada0; border: 1px solid #72302d; }
      details { margin-top: 14px; color: #9da3af; }
      summary { cursor: pointer; font-size: 13px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; color: #b8bec9; }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; margin-top: 14px; background: #000; border-radius: 10px; }
      video[hidden] { display: none; }
      .ok { color: #77dbb4; } .bad { color: #ff8b70; }
      @media (max-width: 700px) { body { padding: 16px; } .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
    </style>
  </head>
  <body>
    <main>
      <small>PUBLIC STORY KERNEL PROTOCOL</small>
      <h1>Start a renderer-credential run.</h1>
      <p>The Pickford session provisions an inactive local story. Runtime login, DSS, acknowledgements, and playback use the renderer installation credential.</p>
      <form id="run-form">
        <div class="grid">
          <label>Show API <input name="showBaseUrl"  required /></label>
          <label>Renderer Platform <input name="rendererBaseUrl"  required /></label>
          <label>Room name <input name="roomName" value="H3 Public Renderer Run" required /></label>
          <label>Setup account email <input name="email" type="email"  autocomplete="username" required /></label>
          <label>Setup account password <input name="password" type="password"  autocomplete="current-password" required /></label>
          <label>Renderer ID <input name="rendererId" autocomplete="off" required /></label>
          <label>Credential ID <input name="credentialId" autocomplete="off" required /></label>
          <label class="wide">Client secret — runtime only <input name="clientSecret" type="password" autocomplete="off" required /></label>
          <label class="wide">Narrative Engine EVD <input name="evdId"  required /></label>
          <label>Resolution <select name="resolution"><option selected>480P</option><option>768P</option></select></label>
          <label>Clip length <select name="clipDurationSeconds"><option selected>5</option><option>6</option><option>8</option></select></label>
        </div>
        <button id="start" type="submit">Provision story & start renderer</button>
        <button id="stop" type="button" hidden>Stop story</button>
      </form>
      <section>
        <strong id="state">Ready</strong>
        <video id="stream" controls autoplay playsinline hidden></video>
        <details>
          <summary>Run diagnostics</summary>
          <pre id="evidence">No run started.</pre>
        </details>
      </section>
    </main>
    <script type="module">
      import Hls from '/vendor/hls.js';

      const form = document.querySelector('#run-form');
      fetch('/api/config').then(response => response.json()).then(config => {
        for (const [field, key] of [['showBaseUrl', 'narrativeEngineUrl'], ['rendererBaseUrl', 'rendererBaseUrl']]) {
          if (config[key]) form.elements[field].value = config[key];
        }
      }).catch(() => undefined);
      const start = document.querySelector('#start');
      const stop = document.querySelector('#stop');
      const state = document.querySelector('#state');
      const evidence = document.querySelector('#evidence');
      const stream = document.querySelector('#stream');
      let poll;
      let hls;
      let currentStatus;

      function resetPlayer() {
        if (hls) {
          hls.destroy();
          hls = undefined;
        }
        stream.pause();
        stream.removeAttribute('src');
        stream.removeAttribute('data-url');
        stream.load();
        stream.hidden = true;
      }

      function playStream(url) {
        if (hls) {
          hls.destroy();
          hls = undefined;
        }
        stream.removeAttribute('src');
        stream.load();
        if (Hls.isSupported()) {
          hls = new Hls({ liveSyncDurationCount: 1, liveMaxLatencyDurationCount: 3 });
          hls.on(Hls.Events.MANIFEST_PARSED, () => stream.play().catch(() => undefined));
          hls.on(Hls.Events.ERROR, (_event, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else {
              state.textContent = `Stream failed: ${data.details}`;
              state.className = 'bad';
            }
          });
          hls.loadSource(url);
          hls.attachMedia(stream);
          return;
        }
        if (!stream.canPlayType('application/vnd.apple.mpegurl')) {
          throw new Error('This browser cannot play the HLS stream.');
        }
        stream.src = url;
        stream.play().catch(() => undefined);
      }

      async function json(response) {
        const body = await response.json();
        if (!response.ok) {
          const detail = body.error ?? body.detail ?? response.statusText;
          throw new Error(`${response.status}: ${typeof detail === 'string' ? detail : JSON.stringify(detail)}`);
        }
        return body;
      }

      async function watchRun(runId) {
        clearInterval(poll);
        const update = async () => {
          const status = await json(await fetch(`/api/external-renderer/runs/${runId}`));
          currentStatus = status;
          state.textContent = status.state === 'failed'
            ? 'Run failed'
            : status.state === 'running' && status.clipsRendered === 0
              ? 'Generating first story scene…'
              : status.state === 'running' ? 'Story live' : status.state;
          state.className = status.state === 'failed' ? 'bad' : status.state === 'running' ? 'ok' : '';
          evidence.textContent = JSON.stringify(status, null, 2);
          if (status.hlsUrl && status.clipsRendered > 0 && stream.dataset.url !== status.hlsUrl) {
            const manifestReady = await fetch(status.hlsUrl, { cache: 'no-store' })
              .then((response) => response.ok)
              .catch(() => false);
            if (manifestReady) {
              stream.hidden = false;
              stream.dataset.url = status.hlsUrl;
              playStream(status.hlsUrl);
            }
          }
          if (status.state === 'failed' || status.state === 'stopped') {
            if (status.clipsRendered === 0) stream.hidden = true;
            clearInterval(poll);
            start.disabled = false;
          }
          stop.hidden = status.state === 'stopped';
          if (status.state !== 'stopped') stop.disabled = false;
        };
        await update();
        poll = setInterval(() => update().catch((error) => {
          state.textContent = error.message;
          state.className = 'bad';
        }), 1000);
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearInterval(poll);
        start.disabled = true;
        stop.disabled = false;
        state.className = '';
        state.textContent = 'Provisioning inactive story…';
        evidence.textContent = '';
        const values = Object.fromEntries(new FormData(form));
        try {
          const provisioned = await json(await fetch('/api/narrative/provision-external-story', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              baseUrl: values.showBaseUrl, email: values.email, password: values.password, roomName: values.roomName,
              evdId: values.evdId, storyType: 'WHISPERS',
            }),
          }));
          state.textContent = 'Connecting renderer bridge…';
          const run = await json(await fetch('/api/external-renderer/runs', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              baseUrl: values.rendererBaseUrl,
              rendererId: values.rendererId,
              credentialId: values.credentialId,
              clientSecret: values.clientSecret,
              rendererVersion: 'h3.local.public.1',
              storyId: provisioned.storyId,
              roomId: provisioned.roomId,
              roomShortlink: provisioned.roomShortlink,
              storyMessageChannelId: provisioned.storyMessageChannelId,
              roomMainMessageChannelId: provisioned.roomMainMessageChannelId,
              storyConfig: {
                base_structure: 'WHISPERS', needs_plan_generation: false, evd_id: values.evdId,
                message_channel_ids: [provisioned.storyMessageChannelId], use_existing_stream: true,
                generate_audio: true, text_only: false, audio_only: false,
                story_block_target_lines: 12,
              },
              resolution: values.resolution, clipDurationSeconds: Number(values.clipDurationSeconds),
              resumeExistingStory: false,
            }),
          }));
          history.replaceState({}, '', `${location.pathname}?run=${encodeURIComponent(run.runId)}`);
          await watchRun(run.runId);
        } catch (error) {
          state.textContent = 'Run failed';
          state.className = 'bad';
          evidence.textContent = error instanceof Error ? error.message : String(error);
          start.disabled = false;
        }
      });

      stop.addEventListener('click', async () => {
        if (!currentStatus || stop.disabled) return;
        clearInterval(poll);
        stop.disabled = true;
        start.disabled = true;
        state.className = '';
        state.textContent = 'Stopping story…';
        const values = Object.fromEntries(new FormData(form));
        try {
          await json(await fetch(`/api/external-renderer/runs/${currentStatus.runId}`, { method: 'DELETE' }));
          await json(await fetch('/api/narrative/stop-show', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              baseUrl: values.showBaseUrl,
              shortlink: currentStatus.roomShortlink,
              email: values.email,
              password: values.password,
            }),
          }));
          resetPlayer();
          history.replaceState({}, '', location.pathname);
          state.textContent = 'Story stopped';
          state.className = 'ok';
          evidence.textContent = 'The Story Kernel story, renderer queue, and live playout have stopped.';
          currentStatus = undefined;
          stop.hidden = true;
          start.disabled = false;
        } catch (error) {
          state.textContent = 'Could not fully stop story';
          state.className = 'bad';
          evidence.textContent = error instanceof Error ? error.message : String(error);
          stop.disabled = false;
        }
      });

      const existingRunId = new URLSearchParams(location.search).get('run');
      if (existingRunId && /^[0-9a-f-]{36}$/i.test(existingRunId)) {
        start.disabled = true;
        state.textContent = 'Reconnecting to renderer run…';
        watchRun(existingRunId).catch((error) => {
          state.textContent = 'Could not reconnect';
          state.className = 'bad';
          evidence.textContent = error instanceof Error ? error.message : String(error);
          start.disabled = false;
        });
      }
    </script>
  </body>
</html>
