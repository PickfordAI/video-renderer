# Set the application name through `fly deploy --app <name>`.
primary_region = "yyz"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  build-target = "hosted"

[env]
  HOST = "::"
  MEDIA_HOST = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 4174
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
