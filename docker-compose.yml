services:
  media-relay:
    image: bluenviron/mediamtx:1.12.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./media-relay/mediamtx.yml:/mediamtx.yml:ro

  renderer:
    profiles: [full]
    build:
      context: .
      target: runtime
    depends_on:
      - media-relay
    ports:
      - "127.0.0.1:4173:4173"
      - "127.0.0.1:4174:4174"
    environment:
      HOST: 0.0.0.0
      MEDIA_HOST: 0.0.0.0
      FAL_KEY: "${FAL_KEY:-}"
      MINIMAX_API_KEY: "${MINIMAX_API_KEY:-}"
      MINIMAX_API_BASE_URL: "${MINIMAX_API_BASE_URL:-https://api.minimax.io}"
      MINIMAX_VIDEO_MODEL_ID: "${MINIMAX_VIDEO_MODEL_ID:-MiniMax-H3-Max}"
      MINIMAX_REFERENCE_VIDEO_MODEL_ID: "${MINIMAX_REFERENCE_VIDEO_MODEL_ID:-MiniMax-H3}"
      RENDERER_PLATFORM_BASE_URL: "${RENDERER_PLATFORM_BASE_URL:-}"
      RENDERER_PLATFORM_WEBSOCKET_URL: "${RENDERER_PLATFORM_WEBSOCKET_URL:-}"
      RENDERER_PLATFORM_ENVIRONMENT: "${RENDERER_PLATFORM_ENVIRONMENT:-local}"
      RENDERER_ID: "${RENDERER_ID:-}"
      RENDERER_CREDENTIAL_ID: "${RENDERER_CREDENTIAL_ID:-}"
      RENDERER_CLIENT_SECRET: "${RENDERER_CLIENT_SECRET:-}"
      RENDERER_VERSION: "${RENDERER_VERSION:-minimax.20260904.local.1}"
      RENDERER_REGISTER_MANIFEST: "${RENDERER_REGISTER_MANIFEST:-true}"
      RENDERER_RESOLUTION: "${RENDERER_RESOLUTION:-480P}"
      RENDERER_CLIP_DURATION_SECONDS: "${RENDERER_CLIP_DURATION_SECONDS:-5}"
      FAL_VIDEO_MODEL_ID: "${FAL_VIDEO_MODEL_ID:-minimax/h3-max-turbo/text-to-video}"
      FAL_REFERENCE_VIDEO_MODEL_ID: "${FAL_REFERENCE_VIDEO_MODEL_ID:-minimax/h3-max/reference-to-video}"
      FAL_QUEUE_BASE_URL: "${FAL_QUEUE_BASE_URL:-https://queue.fal.run}"
      MEDIA_RELAY_RTSP_BASE_URL: rtsp://media-relay:8554
      MEDIA_RELAY_HLS_BASE_URL: http://media-relay:8888
      MEDIA_RELAY_AUDIENCE_DELAY_SECONDS: "${MEDIA_RELAY_AUDIENCE_DELAY_SECONDS:-3}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
