name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: docker compose config --quiet
      - run: docker compose -f deploy/compose.vm.yml config --quiet
        env:
          FAL_KEY: test-only
          RENDERER_ADMIN_TOKEN: test-only
          RENDERER_DOMAIN: stories.example.com
      - run: docker build --target hosted -t pickford-renderer-check .
